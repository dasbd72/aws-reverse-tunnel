[project]
name = "aws-reverse-tunnel"
version = "0.1.0"
description = "Expose a local service to the internet through an AWS EC2 instance and an AWS SSM session."
readme = "README.md"
authors = [
    { name = "dasbd72", email = "twbd723@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pre-commit>=4.6.2",
]

[project.scripts]
aws-reverse-tunnel = "aws_reverse_tunnel:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
